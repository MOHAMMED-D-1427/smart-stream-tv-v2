<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/output.css">
    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/a034b0a078.js" crossorigin="anonymous"></script>

    <script type="module" src="./js/app.js" defer></script>

    <title>Smart Stream TV</title>
</head>
<body class="bg-black text-gray-300 relative">
    <!-- ================== HTTP Errors ======================== -->
    <span id="http-error" class="hidden items-center gap-1.5 font-bold  fixed z-20 top-0 right-0 m-3 text-[#ff0000f5] bg-[#150062] py-1 px-2 border-2 border-primary rounded">
    </span>
    <!-- ================== Loeading Icon ======================== -->
     <div id="loading" class="backdrop-brightness-35 fixed top-0 hidden justify-center z-11 w-full h-full ">
        <img src="assets/satellite.svg" class="w-16.75" alt="Loading">
     </div>


    <header class="px-[3%] mx-auto fixed top-0 w-full bg-black flex justify-between items-center">
         <img src="assets/Smart Stream TV Logo.png" alt="Website logo" class="w-37.5">
        <div class="flex items-center gap-2">
            <button id="add-channel-btn" type="button" class="border-2 border-primary rounded px-2 py-1 cursor-pointer hover:bg-primary font-bold active:opacity-80">Add channel</button>
            <span id="side-bar-btn" class="border-2 border-primary rounded px-2 py-1 cursor-pointer hover:bg-primary font-bold active:opacity-80">Search</span>
        </div>

    </header>

    <!-- ================== ADD CHANNEL S -->
    <div id="add-channel-popup" class="invisible fixed inset-0 z-12 h-full w-full bg-[#0000009c] flex justify-center items-center">
        <form id="add-channel-form" class="w-fit overflow-y-auto scrollbar-thumb-primary scrollbar-thin flex flex-col gap-3 bg-gray-950 p-5 border border-primary rounded">
            <h2 class="text-[22px] font-bold text-center">Add a channel</h2>

            <label class="flex flex-col gap-1">
                <span class="font-bold">Channel Name</span>
                <input id="channel-name"  placeholder="ES - NEWS 4K" class="border-2 border-secondary rounded bg-black text-gray-300 outline-none px-2 py-1.5" >
                <span id="name-error" class="font-bold text-red-700 text-[14px]"></span>
            </label>

            <label class="flex flex-col gap-1">
                <span class="font-bold">Category</span>
                <select id="channel-category" class="border-2 border-secondary rounded bg-black text-white outline-none px-2 py-1.5" >
                    <option value="DOCUMENTARY">DOCUMENTARY</option>
                    <option value="RELIGION">RELIGION</option>
                    <option value="NEWS">NEWS</option>
                    <option value="CULTURE">CULTURE</option>
                    <option value="KIDS">KIDS</option>
                    <option value="ENTERTAINMENT">ENTERTAINMENT</option>
                    <option value="CINEMA">CINEMA</option>
                    <option value="SPORT">SPORT</option>
                </select>
            </label>


            <label class="flex flex-col gap-1">
                <span class="font-bold">Channel number</span>
                <input id="channel-number" name="channelNumber" placeholder="1253" class="border-2 border-secondary rounded bg-black text-gray-300 outline-none px-2 py-1.5" >
                <span id="number-error" class="font-bold text-red-700 text-[14px]"></span>
            </label>

            <label class="flex flex-col gap-1">
                <span class="font-bold">Logo URL</span>
                <input id="channel-logo" type="url" placeholder="https://example.com/logo.png" class="border-2 border-secondary rounded bg-black text-gray-300 outline-none px-2 py-1.5" >
                <span id="logo-error" class="font-bold text-red-700 text-[14px]"></span>
            </label>

            <p id="add-channel-error" class="hidden text-sm text-red-700 font-bold"></p>

            <div class="flex justify-evenly gap-2 pt-1">
                <button id="add-channel-confirm" type="submit" class="border-2 border-primary rounded px-3 py-1 font-bold cursor-pointer hover:bg-primary hover:scale-105">Add</button>
                <button id="add-channel-cancel" type="button" class="border-2 border-red-800 rounded px-3 py-1 font-bold cursor-pointer hover:scale-105">Cancel</button>
            </div>
        </form>
    </div>
    <!-- ================== ADD CHANNEL:END -->


    <main class="my-10 mt-30">

        <div id="confirm-popup" class="invisible fixed top-0 z-12 h-full w-full bg-[#0000009c] flex justify-center items-center">    
            <div class="border border-primary h-32.75 w-67.5 flex flex-col items-center justify-between bg-black p-3 rounded">
                <p class="font-bold text-center"><i class=" fas fa-exclamation-triangle"></i>Delete this channel <br><span class="ch-name underline font-bold"></span>?</p>
                <div class="flex gap-2 justify-evenly w-full">
                    <button id="confirm" class="border-2 border-red-800 rounded px-2 py-1 font-bold cursor-pointer hover:scale-110">Confirm</button>
                    <button id="cancel" class="bg-primary border-0 rounded px-2 py-1 font-bold cursor-pointer hover:scale-110">Cancel</button>
                </div>
            </div>
        </div>
        
        <!-- ==================== Channels & TV Player -->
         <div class="flex justify-center gap-5 ">

                <div id="side-bar"  class="text-sm bg-gray-950 box-shadow w-112.5 m-3 border-2 border-primary px-4 pb-7 fixed left-0 top-25 rounded h-screen overflow-y-scroll scrollbar-thumb-primary scrollbar-thin transition-all">
                    <div class="s-f-container sticky top-0 z-10 pt-2.5 bg-gray-950">
                    <!-- ==================== Search -->
                            <span id="histories" class="px-2 py-1 border-2 rounded border-primary bg-[#2d00cf36] hover:bg-[#eeeeee21] cursor-pointer"><i class="fas fas fa-history text-[#777777]"></i></span>

                    <div class="border-2  border-secondary flex items-center w-full rounded px-2 py-0.5 my-3.5 mx-auto">
                        
                        <input id="search" placeholder="Search a channel" class="border-0 outline-none text-gray-400 w-full p-1">
                        <i class="fas fa-search text-secondary text-[20px]"></i>
                        
                    </div>
                    <!-- ==================== Filter -->
                    <div class="flex items-baseline justify-between ">
                        <select class="w-fit mb-3 p-1.5 rounded bg-black text-white outline-none" id="categories">
                            <option value="">All categories</option>
                            <option value="DOCUMENTARY">DOCUMENTARY</option>
                            <option value="RELIGION">RELIGION</option>
                            <option value="NEWS">NEWS</option>
                            <option value="CULTURE">CULTURE</option>
                            <option value="KIDS">KIDS</option>
                            <option value="ENTERTAINMENT">ENTERTAINMENT</option>
                            <option value="CINEMA">CINEMA</option>
                            <option value="SPORT">SPORT</option>
                        </select>
                        <!-- ----------------------- -->
                         <div class="font-bold">
                            <span id="favorites" class="px-2 py-1 border-2 rounded border-primary bg-[#2d00cf36] hover:bg-[#eeeeee21] cursor-pointer">Favorites <i class="fas fa-star text-yellow-600"></i></span>
                            <span id="blacklist" class="px-2 py-1 border-2 rounded border-primary bg-[#2d00cf36] hover:bg-[#eeeeee21] cursor-pointer">Black list <i class="fa-solid fa-ban text-red-400"></i></span>
                         </div>
                    </div>
                </div>
                
                <table class="w-full border border-gray-900 " >
                    <tbody id="channels">
                        <tr class="border-b border-gray-900 px-1 chan-hover">

                            <td>&nbsp; 1127</td><td><img src="https://placehold.co/60x60.png?text=Mumbai" alt="Channel Logo" class="w-12.75"></td><td class="h-12.75 flex justify-between items-center">IN - MUMBAI NEWS HD 
                                <span class="w-12.5 flex justify-around"><i class="far fa-star not-favorite"></i><i class="fas fa-star favorite text-yellow-500 hover:text-yellow-200"></i>
                                    <i class="fa-solid fa-ban hover:text-red-400"></i></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
               
            <!-- =================================== Channel Info ================ -->
            <div class="bg-gray-950 px-4 py-7 rounded w-112.5 h-fit  ">
                <div>

                    <p class="text-2xl font-bold text-center mb-3">Channel Player <i class="fas fa-play-circle"></i></p>
                    <div id="player" class="mx-auto border-2 border-gray-900 w-100 h-70 flex justify-center items-center">
                        <span id="empty-player"><i class="fas fa-video-slash"></i> No Channel is live</span>
                        <video class="hidden border border-primary rounded  w-100 h-full" controls src="" ></video>
                    </div>
                </div>


                <hr class="text-gray-900 my-9">

                <div id="chan-info">
                    <p class="text-[20px] font-bold pb-2.5">Channel Info</p>

                    <div class="border border-secondary rounded">

                        <table class="w-full">
                            <tbody>
                                <tr>
                                    <td class="p-2">Name</td><td id="name" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Program</td><td id="program" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Number</td><td id="number" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Country</td><td id="country" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Start time</td><td id="s-time" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                                <tr>
                                    <td class="p-2">Start end</td><td id="e-time" class="text-gray-700">XXXXXXXXXXXX</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </main>
</body>
</html>
